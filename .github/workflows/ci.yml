name: CI

on:
  push:
    branches:
      - main
      - feature/gh-actions
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Run unit tests
        run: cd backend/user-service && mvn -q test

  integration-tests:
    runs-on: ubuntu-24.04
    needs: unit-tests
    # if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v6

      - name: Install Docker
        uses: docker/setup-buildx-action@v4

      - name: Run Docker Compose
        run: cp .env.example .env && docker compose up -d

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install requests

      - name: Run integration tests
        run: python backend/user-service/src/test/python/test.py

      - name: Tear down
        run: docker compose down -v

  Docker-upload:
    runs-on: ubuntu-24.04
    needs: integration-tests
    # if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: backend/user-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/user-service:latest, ${{ secrets.DOCKER_USERNAME }}/user-service:${{ github.sha }}
