name: CI

on:
  push:
    branches:
      - main
      - feature/gh-actions
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Run unit tests
        run: cd backend/user-service && mvn -q test

  integration-tests:
    runs-on: ubuntu-24.04
    needs: unit-tests

    steps:
      - uses: actions/checkout@v6

      - name: Install Docker
        uses: docker/setup-buildx-action@v4

      - name: Run Docker Compose
        run: docker compose up -d

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install requests

      - name: Run integration tests
        run: python backend/user-service/src/test/python/test.py

      - name: Tear down
        run: docker compose down -v
