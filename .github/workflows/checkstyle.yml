name: Checkstyle

on:
  push:
    branches:
      - feature/gh-actions
  pull_request:

jobs:
  checkstyle:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: dbelyaev/action-checkstyle@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workdir: 'backend'
          level: error
          fail_level: error
